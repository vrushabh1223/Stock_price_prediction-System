<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — StockAI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="auth-body">

<div class="auth-bg">
    <div class="grid-lines"></div>
    <div class="glow-orb orb1"></div>
    <div class="glow-orb orb2"></div>
</div>

<div class="auth-wrapper">
    <!-- LEFT PANEL -->
    <div class="auth-panel-left">
        <div class="brand">
            <span class="brand-icon">◈</span>
            <span class="brand-name">StockAI</span>
        </div>
        <h1 class="auth-headline">Predict the<br><span class="accent">Market.</span><br>Ahead of time.</h1>
        <p class="auth-subtext">LSTM-powered stock price forecasting with real-time data integration.</p>
        <div class="stats-row">
            <div class="stat-chip"><span class="stat-val">98.2%</span><span class="stat-label">Accuracy</span></div>
            <div class="stat-chip"><span class="stat-val">18+</span><span class="stat-label">Stocks</span></div>
            <div class="stat-chip"><span class="stat-val">60-day</span><span class="stat-label">Window</span></div>
        </div>
    </div>

    <!-- RIGHT PANEL -->
    <div class="auth-panel-right">
        <div class="auth-card">
            <h2 class="form-title">Welcome back</h2>
            <p class="form-subtitle">Sign in to your account</p>

            {% if message %}
                <div class="alert-error">⚠ {{ message }}</div>
            {% endif %}

            <form action="/login" method="POST" class="auth-form">
                <div class="field-group">
                    <label>Username</label>
                    <input type="text" name="username" placeholder="Enter username" required autocomplete="username">
                </div>
                <div class="field-group">
                    <label>Password</label>
                    <div class="pass-wrap">
                        <input type="password" name="password" id="passInput" placeholder="Enter password" required autocomplete="current-password">
                        <button type="button" class="pass-toggle" onclick="togglePass()">👁</button>
                    </div>
                </div>
                <button type="submit" class="btn-primary">Sign In →</button>
            </form>

            <div class="auth-divider"><span>or</span></div>

            <a href="{{ url_for('google_login') }}" class="btn-google">
                <svg width="18" height="18" viewBox="0 0 48 48">
                    <path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 2.9l5.7-5.7C34.5 6.5 29.5 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.9z"/>
                    <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 16 19 13 24 13c3.1 0 5.8 1.1 8 2.9l5.7-5.7C34.5 6.5 29.5 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/>
                    <path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.3 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8H6.3C9.7 35.7 16.3 40 24 40v4z"/>
                    <path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.8 2.3-2.3 4.2-4.3 5.6l6.2 5.2C41 35.3 44 30 44 24c0-1.3-.1-2.7-.4-3.9z"/>
                </svg>
                Continue with Google
            </a>

            <p class="switch-link">New here? <a href="/register">Create an account</a></p>
        </div>
    </div>
</div>

<script>
function togglePass() {
    const inp = document.getElementById('passInput');
    inp.type = inp.type === 'password' ? 'text' : 'password';
}
</script>
</body>
</html>
